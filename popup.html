<!DOCTYPE html>
<html lang="en">
<head>

        <span class="b20-title">Beyond20</span>
        <span class="b20-context-badge" id="b20-context-badge" style="display: none;"></span>

    </button>
  </header>
  <nav class="b20-tabs" id="b20-popup-tabs" style="display: none;" role="tablist">
    <button type="button" class="b20-tab active" data-tab="quick" role="tab" aria-selected="true">Quick</button>
    <button type="button" class="b20-tab" data-tab="effects" id="openEffects" style="display: none;" role="tab" aria-selected="false">Effects</button>
    <button type="button" class="b20-tab" data-tab="advanced" id="toggleAdvanced" style="display: none;" role="tab" aria-selected="false">Advanced</button>
  </nav>
  <main class="b20-main">
  </main>
